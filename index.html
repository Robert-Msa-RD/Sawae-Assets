:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2327;--mute:#5d676d;--line:#d9d5cb;--acc:#0b5d66;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191b;--card:#1f2527;--ink:#ecebe6;--mute:#9aa5aa;--line:#333c3f;--acc:#5fc2cc;--accink:#0d1b1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15191b;--card:#1f2527;--ink:#ecebe6;--mute:#9aa5aa;--line:#333c3f;--acc:#5fc2cc;--accink:#0d1b1d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 22px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:inherit;text-decoration:none}
.card:hover,.card:focus-visible{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:1px}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.card div{padding:10px 12px 12px}.card b{display:block;font-weight:600;line-height:1.3}
.card span{color:var(--mute);font-size:.85rem}
.back{display:inline-block;margin-bottom:16px;color:var(--acc);font-weight:600;text-decoration:none}
.item{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:760px){.item{grid-template-columns:1.2fr 1fr;align-items:start}}
.item img.hero{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.tag{color:var(--mute);font-size:.9rem;margin:0 0 6px}
h2{font-size:1.9rem;line-height:1.15;margin:0 0 12px;font-weight:800}
ul{padding-left:1.1em;margin:14px 0}li{margin:3px 0}
.qr{display:flex;gap:14px;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.qr .box{background:#fff;padding:8px;border-radius:6px;line-height:0;flex:none}
.qr .box svg{width:132px;height:132px}
.qr p{margin:0;color:var(--mute);font-size:.88rem}
@media print{.back{display:none}}

const app=document.getElementById('app');
const base=()=>location.href.split('#')[0];
function home(){
  app.innerHTML='<h1>Asset register</h1><p class="sub">'+D.length+' items. Open an item to see its description and QR code.</p><div class="grid">'+
  D.map(x=>'<a class="card" href="#'+x.slug+'"><img src="'+x.img+'" alt="'+x.title+'" loading="lazy"><div><b>'+x.title+'</b><span>'+x.id+' · '+x.cat+'</span></div></a>').join('')+'</div>';
}
function item(x){
  let svg='';
  try{const q=qrcode(0,'M');q.addData(base()+'#'+x.slug);q.make();svg=q.createSvgTag(4,0);}catch(e){svg='';}
  app.innerHTML='<a class="back" href="#">Back to all items</a><div class="item"><img class="hero" src="'+x.img+'" alt="'+x.title+'"><div>'+
  '<p class="tag">'+x.id+' · '+x.cat+'</p><h2>'+x.title+'</h2><p>'+x.desc+'</p><ul>'+x.specs.map(s=>'<li>'+s+'</li>').join('')+'</ul>'+
  '<div class="qr"><div class="box">'+svg+'</div><p>Scan to open this page. Print and stick it on the item.</p></div></div></div>';
}
function route(){const h=location.hash.slice(1);const x=D.find(i=>i.slug===h);x?item(x):home();window.scrollTo(0,0);document.title=x?x.title+' – Asset register':'Asset register';}
addEventListener('hashchange',route);route();
</script></body></html>
